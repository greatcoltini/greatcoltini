name: Update contribution snake

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/contribution-snake.yml
      - .github/scripts/merge-contributions.mjs
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Platane/snk reads one account, so its generator runs with a fetch wrapper
      # that adds the work account's contributions to the grid.
      - name: Generate contribution snake (personal + work)
        run: >
          npx -y generate-snake-animation@3.5.0
          --github_user=${{ github.repository_owner }}
          "--output=assets/contribution-snake.svg?color_snake=#e5bd65&color_dots=#161b22,#4d422b,#786035,#b08c45,#e5bd65"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAKE_EXTRA_USERS: cdonkersgoedkxs
          NODE_OPTIONS: --import ./.github/scripts/merge-contributions.mjs
      - name: Commit updated contribution animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update contribution snake"
            git push
          fi
