<svg xmlns="http://www.w3.org/2000/svg" width="920" height="270" viewBox="0 0 920 270" role="img" aria-label="GreatColtini Industries. Building Kingdom TD. Indie developer and AI platform engineer.">
<defs><linearGradient id="bg"><stop stop-color="#19262e"/><stop offset="1" stop-color="#241609"/></linearGradient><linearGradient id="shine"><stop stop-color="#94692b"/><stop offset=".5" stop-color="#ffe4a0"/><stop offset="1" stop-color="#94692b"/></linearGradient><clipPath id="type"><rect class="reveal" x="175" y="182" width="580" height="45"/></clipPath></defs>
<style>.reveal{animation:type 7s steps(32,end) infinite}.cursor{animation:blink 1s steps(1,end) infinite}.trace{stroke-dasharray:190 2200;animation:trace 14s linear infinite}.line1{animation:first 14s steps(1,end) infinite}.line2{opacity:0;animation:second 14s steps(1,end) infinite}@keyframes type{0%,6%{width:0}48%,88%{width:580}100%{width:0}}@keyframes blink{50%{opacity:0}}@keyframes trace{to{stroke-dashoffset:-2390}}@keyframes first{0%,49.99%{opacity:1}50%,100%{opacity:0}}@keyframes second{0%,49.99%{opacity:0}50%,100%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.reveal{width:580px}.line1{opacity:1}.line2,.cursor,.trace{display:none}}</style>
<rect width="920" height="270" fill="url(#bg)"/><rect x="14" y="14" width="892" height="242" fill="none" stroke="#604c2a"/><rect class="trace" x="14" y="14" width="892" height="242" fill="none" stroke="url(#shine)" stroke-width="2"/>
<text x="460" y="54" text-anchor="middle" font-family="monospace" font-size="14" fill="#a4b3b7" letter-spacing="4">INDIE DEVELOPER | AI PLATFORM ENGINEER</text>
<text x="460" y="123" text-anchor="middle" fill="#f1e5cc" font-family="Georgia,serif" font-size="68">GreatColtini</text><text x="460" y="162" text-anchor="middle" fill="#e5bd65" font-family="Arial,sans-serif" font-size="21" letter-spacing="9">INDUSTRIES</text>
<g clip-path="url(#type)" font-family="monospace" font-size="24" fill="#e5bd65"><text class="line1" x="180" y="215">&gt; Building Kingdom TD.<tspan class="cursor">_</tspan></text><text class="line2" x="180" y="215">&gt; Games. Mods. One more run.<tspan class="cursor">_</tspan></text></g></svg>